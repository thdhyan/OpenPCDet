# Foundation Model Debug UI + Isaac Sim + Model Servers
#
# Usage (from repo root):
#   docker compose -f docker/docker-compose-fm.yml up -d
#   open http://localhost:8080
#
# Services:
#   fm-ui        — Debug UI + WebSocket proxy (port 8080)
#   isaac-sim    — Isaac Sim container (GPU, RTX LiDAR, camera)
#   sim-ws       — Sim WebSocket bridge (port 8766)
#
# Model servers (GR00T/Cosmos) run on spark02 and connect back to fm-ui proxy

services:
  # ── Foundation Model Debug UI (browser interface) ──────────────────────────
  fm-ui:
    image: python:3.12-slim
    container_name: fm-ui
    network_mode: host
    volumes:
      - ../fm_debug_ui:/workspace/fm_ui:ro
    working_dir: /workspace/fm_ui
    command: >
      bash -c "pip install -q aiohttp websockets numpy Pillow &&
               python server.py --port 8080"
    restart: unless-stopped

  # ── Isaac Sim (main warehouse scene with G1 + table + wheel) ──────────────
  isaac-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: isaac-sim-fm
    network_mode: host
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ../:/workspace/thesis-sim
    entrypoint:
      - /bin/bash
      - /workspace/thesis-sim/docker/entrypoint.sh
    environment:
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      - PYTHONPATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/rclpy
      - ISAAC_SIM_ROOT=/isaac-sim
    depends_on:
      - fm-ui

  # ── Sim WebSocket Bridge (same Isaac image; shares host DDS) ───────────────
  sim-ws:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sim-ws-bridge
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - ../:/workspace/thesis-sim
    working_dir: /workspace/thesis-sim
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=jazzy
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - LD_LIBRARY_PATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      - PYTHONPATH=/isaac-sim/exts/isaacsim.ros2.core/jazzy/rclpy
      - ISAAC_SIM_ROOT=/isaac-sim
    command: >
      bash -lc "/isaac-sim/python.sh -m pip install -q websockets Pillow &&
               /isaac-sim/python.sh scripts/sim_ws_bridge.py --port 8766 --rate-hz 10"
    depends_on:
      - isaac-sim
    restart: unless-stopped

# ── Model servers (run on spark02, not in this compose) ──────────────────────
# GR00T N1.7: ssh aim_spark02; nohup ~/venvs/gr00t/bin/python \
#   ~/Projects/fm-debug-ui/scripts/gr00t_ws_server.py --port 8765 \
#   --model ~/foundation_models/GR00T-N1.7-3B --device cuda > ~/gr00t_ws.log 2>&1 &
# UnifoLM-VLA (lazy, EEF23 preview only):
#   PYTHONPATH=~/UnifoLM-VLA/src nohup ~/venvs/gr00t/bin/python \
#   ~/Projects/fm-debug-ui/scripts/unifolm_ws_server.py --port 8767 \
#   --ckpt ~/foundation_models/UnifoLM-VLA-Base/checkpoints/pytorch_model.pt \
#   --vlm ~/foundation_models/UnifoLM-VLM-Base > ~/unifolm_ws.log 2>&1 &
# Cosmos: ssh aim_spark02; python cosmos_ws_server.py --port 8770 &

# Isaac Sim 6 + Isaac ROS 4.5 + AgenticROS transport for the G1 graph.
# Run from the repository root on dl (x86_64):
#
#   # CPU-only AgenticROS rosbridge (safe while GPUs are busy)
#   docker compose -f docker/docker-compose-isaac-ros.yml \
#     --profile agent up -d agenticros-rosbridge
#
#   # After a GPU is free, start Isaac Sim + CuVSLAM/NVBlox
#   ISAAC_ROS_GPU=1 docker compose -f docker/docker-compose-isaac-ros.yml \
#     --profile sim --profile perception up -d
#
#   # Run the AgenticROS MCP server for an external Codex/Claude/Hermes client
#   docker compose -f docker/docker-compose-isaac-ros.yml \
#     --profile agent-mcp run --rm agenticros-mcp
#
# The sim owns /tf, /clock, camera, depth, IMU, and LiDAR. Isaac ROS nodes
# join the same host-network CycloneDDS domain. AgenticROS reaches that graph
# through rosbridge on TCP 9091; it does not start Gazebo or a second sim.

services:
  isaac-sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ISAAC_ROS_RELEASE: "${ISAAC_ROS_RELEASE:-4.5}"
    image: g1-isaac-ros:4.5
    container_name: g1-isaac-sim
    profiles: ["sim"]
    network_mode: host
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISAAC_ROS_GPU:-1}"]
              capabilities: [gpu]
    volumes:
      - ../:/workspace/thesis-sim
    environment:
      ISAAC_ROS_GPU: "${ISAAC_ROS_GPU:-1}"
      CUDA_VISIBLE_DEVICES: "${ISAAC_ROS_GPU:-1}"
      NVIDIA_VISIBLE_DEVICES: "${ISAAC_ROS_GPU:-1}"
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      ROS_DOMAIN_ID: "0"
      ROS_DISTRO: jazzy
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ISAAC_SIM_ROOT: /isaac-sim
      LD_LIBRARY_PATH: /isaac-sim/exts/isaacsim.ros2.core/jazzy/lib
      PYTHONPATH: /isaac-sim/exts/isaacsim.ros2.core/jazzy/rclpy
    restart: unless-stopped

  isaac-ros-perception:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        ISAAC_ROS_RELEASE: "${ISAAC_ROS_RELEASE:-4.5}"
    image: g1-isaac-ros:4.5
    container_name: g1-isaac-ros-perception
    profiles: ["perception"]
    network_mode: host
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ISAAC_ROS_GPU:-1}"]
              capabilities: [gpu]
    volumes:
      - ../:/workspace/thesis-sim
    environment:
      ISAAC_ROS_GPU: "${ISAAC_ROS_GPU:-1}"
      CUDA_VISIBLE_DEVICES: "${ISAAC_ROS_GPU:-1}"
      NVIDIA_VISIBLE_DEVICES: "${ISAAC_ROS_GPU:-1}"
      ROS_DOMAIN_ID: "0"
      ROS_DISTRO: jazzy
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    entrypoint: ["/workspace/thesis-sim/docker/ros-perception-entrypoint.sh"]
    command: ["ros2", "launch", "/workspace/thesis-sim/launch/perception_launch.py"]
    depends_on:
      - isaac-sim
    restart: unless-stopped

  agenticros-rosbridge:
    build:
      context: ./agenticros
      dockerfile: Dockerfile.rosbridge
    container_name: g1-agenticros-rosbridge
    profiles: ["agent"]
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      CYCLONEDDS_URI: file:///etc/cyclonedds/cyclonedds.xml
    restart: unless-stopped

  agenticros-mcp:
    build:
      context: ./agenticros
      dockerfile: Dockerfile
    container_name: g1-agenticros-mcp
    profiles: ["agent-mcp"]
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    environment:
      AGENTICROS_TRANSPORT_MODE: rosbridge
      AGENTICROS_ROSBRIDGE_URL: ws://127.0.0.1:9091
      ROS_DOMAIN_ID: "0"
    volumes:
      - ./agenticros/agenticros-config.json:/root/.agenticros/config.json:ro
